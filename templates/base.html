<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Credit Risk Research Prototype{% endblock %}</title>
<style>
 :root{--bg:#f6f7f9;--ink:#1d2733;--mut:#5b6773;--card:#fff;--line:#d9dee4;--acc:#1f5f99;--warn:#8a3b00;--warnbg:#fff3e6}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
 .notice{background:var(--warnbg);color:var(--warn);border-bottom:1px solid #f0c9a0;padding:8px 16px;font-weight:600;text-align:center}
 nav{background:#1a2632;padding:10px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
 nav a{color:#ecf0f1;text-decoration:none} nav a:hover{text-decoration:underline} nav .brand{font-weight:700;margin-right:12px}
 main{max-width:1060px;margin:0 auto;padding:20px 16px 48px} h1{font-size:1.6rem;margin:.2em 0 .4em} h2{font-size:1.2rem;margin:1.6em 0 .5em}
 .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
 table{border-collapse:collapse;width:100%;font-size:.9rem} th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left} th{background:#eef1f4}
 .tablewrap{overflow-x:auto} img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px} .muted{color:var(--mut)} .err{background:#fdecea;border:1px solid #f5b5ae;padding:10px 14px;border-radius:6px}
 label{display:block;font-weight:600;margin-top:10px} input,select{width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit}
 button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:inherit;margin-top:16px;cursor:pointer}
 .big{font-size:2rem;font-weight:700} .tier1{color:#17683a}.tier2{color:#8a6d00}.tier3{color:#a32b1d} small{color:var(--mut)}
</style></head><body>
<div class="notice" role="note">{{ notice }} Outputs are illustrations from historical Lending Club data.</div>
<nav><span class="brand">Credit Risk Research Prototype</span><a href="/">Overview</a><a href="/predict">Predict</a><a href="/dashboard">Model facts</a><a href="/model-results">Study results</a></nav>
<main>{% block body %}{% endblock %}</main>
</body></html>
